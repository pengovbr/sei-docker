apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vol-sei-arquivosexternos
  namespace: ${KUBERNETES_NAMESPACE}
spec:
  accessModes:
  - ReadWriteOnce
  - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: ${KUBERNETES_PVC_STORAGECLASS_ANEXOS_TRAT}

---

